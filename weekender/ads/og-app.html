<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0c1624;font-family:'Radio Canada',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.og{position:relative;width:1200px;height:630px;overflow:hidden}
.photo{position:absolute;inset:-60px;background:url(fine12.jpg) center 55%/cover;filter:blur(12px) saturate(1.2) brightness(.95)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%,rgba(8,12,20,.25) 0%,rgba(8,12,20,.5) 55%,rgba(8,12,20,.8) 100%),linear-gradient(90deg,rgba(8,12,20,.78) 0%,rgba(8,12,20,.45) 50%,rgba(8,12,20,.1) 100%)}
.copy{position:absolute;left:60px;top:104px;width:610px;z-index:5}
.kick{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:linear-gradient(180deg,#ffd76a,#ffc53d);color:#13233a;font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 8px 22px rgba(255,197,61,.35)}
h1{font-size:60px;font-weight:700;line-height:1.02;letter-spacing:-.03em;margin:20px 0 14px}
h1 span{color:#ffc53d;white-space:nowrap}
.sub{font-size:24px;font-weight:500;line-height:1.35;color:#dfe8f2;max-width:540px}
.btns{display:flex;gap:14px;margin-top:24px}
.btns img{height:60px;border-radius:14px;box-shadow:0 12px 26px rgba(0,0,0,.45)}
.free{margin-top:14px;font-size:21px;font-weight:600;color:#fff;display:flex;align-items:center;gap:10px}
.free i{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#ffd76a,#ffc53d);color:#13233a;font-style:normal;font-weight:800;font-size:17px}
.phone{position:absolute;left:836px;top:44px;width:268px;height:560px;border-radius:46px;padding:12px;background:linear-gradient(160deg,#2b3a4f,#0b111a);box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.18);z-index:3}
.screen{width:100%;height:100%;border-radius:35px;background:#13233a url(poster.webp) top/100% auto no-repeat}
.card{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 26px 54px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.14);background-size:100% 100%;z-index:4}
.pick{left:706px;top:170px;width:190px;height:305px;background-image:url(cut_pick.png);transform:rotate(-7deg)}
.eat{left:1012px;top:250px;width:170px;height:247px;background-image:url(cut_eat.png);transform:rotate(7deg)}
.tag{position:absolute;z-index:6;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-size:19px;font-weight:700;color:#13233a;background:rgba(255,255,255,.96);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.tag b{color:#006fbb}
.t1{left:690px;top:128px;transform:rotate(-7deg)}
.t2{left:1000px;top:208px;transform:rotate(7deg)}
</style></head><body><div class="og"><div class="photo"></div><div class="vig"></div>
<div class="copy"><span class="kick">&#128241; The Three Village Local App</span>
<h1>Three Village,<br>right in <span>your pocket.</span></h1>
<p class="sub">Local businesses rated by your neighbors, events, specials and local news. <span style="white-space:nowrap">All live.</span></p>
<div class="btns"><img src="as.png"><img src="gp.png"></div>
<p class="free"><i>&#10003;</i>Free on iPhone and Android</p></div>
<div class="card pick"></div><span class="tag t1">&#128197; <b>This week</b></span>
<div class="phone"><div class="screen"></div></div>
<div class="card eat"></div><span class="tag t2">&#127869;&#65039; <b>Specials</b></span>
</div></body></html>
