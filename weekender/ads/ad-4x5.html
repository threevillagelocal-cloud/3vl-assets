<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0c1018}
body{font-family:'Radio Canada',sans-serif;color:#fff;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.og{position:relative;width:1080px;height:1350px;overflow:hidden}
.bg{position:absolute;inset:-40px;background:url(fine12.jpg) center 55%/cover;filter:blur(7px) saturate(1.15) brightness(1.05)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,13,20,.86) 0%,rgba(10,13,20,.62) 45%,rgba(10,13,20,.28) 100%)}
.left{position:absolute;left:62px;top:52px;width:560px}
.logo{height:80px;display:block;margin-bottom:34px}
.pill{display:inline-flex;align-items:center;gap:14px;background:linear-gradient(180deg,#ff4d45 0%,#e0231c 100%);color:#fff;font-weight:700;font-size:30px;letter-spacing:.14em;padding:12px 28px 12px 22px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px rgba(224,35,28,.45)}
.pill i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.28)}
h1{font-weight:700;font-size:120px;line-height:.9;letter-spacing:-.04em;margin:30px 0 0}
h1 .n{position:relative;display:inline-block;color:#ffc53d;padding-bottom:12px}
h1 .n:after{content:"";position:absolute;left:4px;right:0;bottom:-4px;height:11px;border-radius:12px;background:linear-gradient(90deg,#ffc53d 0%,#ffc53d 55%,rgba(255,197,61,0) 100%)}
.panel{position:absolute;right:48px;top:46px;width:500px;height:538px;border-radius:34px;padding:20px;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  border:1.5px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 30px 70px rgba(0,0,0,.55)}
.bar{display:flex;align-items:center;gap:9px;padding:2px 6px 16px}
.bar i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.35)}
.bar i:first-child{background:#ff4d45}
.bar span{margin-left:auto;height:12px;width:120px;border-radius:8px;background:rgba(255,255,255,.18)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.t{position:relative;height:222px;border-radius:26px;padding:20px 20px 22px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  border:1.5px solid rgba(255,255,255,.45);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -24px 40px rgba(0,0,0,.18),0 14px 28px rgba(0,0,0,.35)}
.t:before{content:"";position:absolute;left:-30%;top:-60%;width:120%;height:110%;background:linear-gradient(160deg,rgba(255,255,255,.42),rgba(255,255,255,.08) 55%,rgba(255,255,255,0) 70%);transform:rotate(-8deg);pointer-events:none}
.t b{position:relative;font-size:38px;line-height:1;font-weight:700;letter-spacing:-.015em}
.ic{position:relative;width:98px;height:98px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.18));border:1.5px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1.5px 0 #fff,0 8px 18px rgba(0,0,0,.18)}
.ic svg{width:64px;height:64px}
.c1{background:linear-gradient(150deg,rgba(52,160,240,.78),rgba(0,98,168,.72))}
.c2{background:linear-gradient(150deg,rgba(255,207,107,.86),rgba(238,159,44,.8));color:#15263a}
.c3{background:linear-gradient(150deg,rgba(34,200,160,.78),rgba(11,122,97,.74))}
.c4{background:linear-gradient(150deg,rgba(255,106,100,.8),rgba(195,34,29,.76))}
.shade{background:linear-gradient(180deg,rgba(10,13,20,.78) 0%,rgba(10,13,20,.55) 45%,rgba(10,13,20,.82) 100%)}
.top{position:absolute;left:0;right:0;text-align:center}
.top .logo{height:92px;margin:0 auto 34px}
.top h1{font-size:150px;margin:26px 0 0}
.sub{font-size:44px;font-weight:600;line-height:1.2;color:#e6edf5;margin-top:24px}
.panel{position:absolute;left:90px;right:90px;width:auto;height:auto}
.t{height:250px}
.cta{position:absolute;left:0;right:0;text-align:center}
.cta b{display:inline-flex;align-items:center;gap:14px;padding:22px 40px;border-radius:999px;font-size:42px;font-weight:700;color:#13233a;background:linear-gradient(180deg,#ffd76a,#ffc53d);box-shadow:0 14px 34px rgba(255,197,61,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.top h1{font-size:132px}.t{height:222px}html,body,.og{width:1080px!important;height:1350px!important}
.top .logo{background:rgba(255,255,255,.94);padding:12px 18px;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.35);height:auto!important;width:320px}
.top h1{font-size:112px;line-height:.95}.t{height:176px}.panel{top:590px!important}.cta{top:1140px!important;bottom:auto!important}</style></head><body><div class="og"><div class="bg"></div><div class="shade"></div>
<div class="top" style="top:70px"><img class="logo" src="logo.png" alt=""><span class="pill"><i></i>LIVE</span><h1>Three Village <span class="n">Now</span></h1><div class="sub">Your live local community dashboard</div></div>
<div class="panel" style="top:640px"><div class="bar"><i></i><i></i><i></i><span></span></div><div class="grid">
    <div class="t c1"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><rect x="6.5" y="12.5" width="3" height="2.6" rx=".6" fill="#fff" stroke="none"/><rect x="10.5" y="12.5" width="3" height="2.6" rx=".6" fill="#fff" stroke="none" opacity=".55"/><rect x="14.5" y="12.5" width="3" height="2.6" rx=".6" fill="#ffc53d" stroke="none"/><rect x="6.5" y="16.3" width="3" height="2.2" rx=".6" fill="#fff" stroke="none" opacity=".55"/></svg></div><b>Events</b></div>
    <div class="t c2"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#15263a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5v7a2.5 2.5 0 0 0 5 0v-7M7.5 2.5v19"/><path d="M19 21.5v-19c-2.4 1.3-3.8 4-3.8 7.3v4.2H19"/></svg></div><b>Eat &amp;<br>Drink</b></div>
    <div class="t c3"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="#ffd166" stroke-width="2"><circle cx="9" cy="9" r="3.4" fill="#ffd166"/><path d="M9 2v1.6M9 14.4V16M2 9h1.6M4 4l1.1 1.1M12.9 5.1 14 4M4 14l1.1-1.1"/></g><path d="M10.5 21h7.5a3.8 3.8 0 0 0 0-7.6 5.2 5.2 0 0 0-9.8 1.6 3 3 0 0 0 2.3 6z" fill="#fff" stroke="#fff" stroke-width="1"/></svg></div><b>Weather</b></div>
    <div class="t c4"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.2 20.3h19.6L12 3z" fill="#fff" stroke="#fff" stroke-width="1.6"/><path d="M12 9.8v5" stroke="#d3261f" stroke-width="2.4"/><circle cx="12" cy="17.4" r="1.25" fill="#d3261f"/></svg></div><b>Alerts</b></div>
  </div></div>
<div class="cta" style="bottom:56px"><b>threevillagelocal.com/now</b></div></div></body></html>
