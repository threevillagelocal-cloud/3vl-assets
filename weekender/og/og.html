<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0f1a28}
body{font-family:'Radio Canada',sans-serif;color:#fff}
.og{position:relative;width:1200px;height:630px;overflow:hidden}
.bg{position:absolute;inset:0;background:url(hero-po.jpg) center 42%/cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,22,32,.97) 0%,rgba(15,22,32,.9) 45%,rgba(15,22,32,.7) 100%)}
.left{position:absolute;left:60px;top:52px;width:600px}
.logo{height:78px;display:block;margin-bottom:30px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.pill{display:inline-flex;align-items:center;gap:14px;background:#e5322d;color:#fff;font-weight:700;font-size:30px;letter-spacing:.12em;padding:12px 26px 12px 22px;border-radius:999px;box-shadow:0 10px 30px rgba(229,50,45,.45)}
.pill i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px rgba(255,255,255,.25)}
h1{font-weight:700;font-size:124px;line-height:.9;letter-spacing:-.035em;margin:26px 0 0}
h1 span{color:#f0ad4e;display:block}
.grid{position:absolute;right:52px;top:52px;width:476px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.t{height:255px;border-radius:28px;padding:26px 24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 20px 44px rgba(0,0,0,.45)}
.t svg{width:74px;height:74px}
.t b{font-size:40px;line-height:1;font-weight:700;letter-spacing:-.01em}
.c1{background:linear-gradient(150deg,#1e88d6,#006fbb)}
.c2{background:linear-gradient(150deg,#ffc860,#f0ad4e);color:#1b2f45}
.c3{background:linear-gradient(150deg,#17a283,#0f866c)}
.c4{background:linear-gradient(150deg,#ef5f5a,#c9302c)}
</style></head>
<body><div class="og">
<div class="bg"></div><div class="shade"></div>
<div class="left">
  <img class="logo" src="logo.png" alt="">
  <span class="pill"><i></i>LIVE</span>
  <h1>Three Village <span>Now</span></h1>
</div>
<div class="grid">
  <div class="t c1"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="8.5" cy="14" r="1.2" fill="#fff"/><circle cx="12" cy="14" r="1.2" fill="#fff"/><circle cx="15.5" cy="14" r="1.2" fill="#fff"/></svg><b>Events</b></div>
  <div class="t c2"><svg viewBox="0 0 24 24" fill="none" stroke="#1b2f45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5v8a2.5 2.5 0 0 0 5 0v-8M8.5 2.5v19M17 21.5v-19c-2.2 1.2-3.5 3.8-3.5 7v4h3.5"/></svg><b>Eat &amp; Drink</b></div>
  <div class="t c3"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.5"/><path d="M9 1.8v1.7M9 14.5v1.7M1.8 9h1.7M3.9 3.9l1.2 1.2M13 5l1.2-1.2M3.9 14.1l1.2-1.2"/><path d="M10 21h8a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.3 1.6A3.2 3.2 0 0 0 10 21z" fill="#0f866c"/></svg><b>Weather</b></div>
  <div class="t c4"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20.5h20L12 3z"/><path d="M12 10v5"/><circle cx="12" cy="17.6" r=".9" fill="#fff"/></svg><b>Alerts</b></div>
</div>
</div></body></html>
