<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b1422}
body{font-family:'Radio Canada',sans-serif;color:#fff}
.og{position:relative;width:1200px;height:630px;overflow:hidden}
.bg{position:absolute;inset:0;background:url(hero-po.jpg) center 42%/cover;filter:saturate(.8)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,20,34,.98) 0%,rgba(11,20,34,.92) 42%,rgba(11,20,34,.78) 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.3px,transparent 1.4px);background-size:22px 22px;-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 70%)}
.g1{position:absolute;left:-160px;bottom:-260px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(240,173,78,.30),transparent 62%)}
.g2{position:absolute;right:-120px;top:-200px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(0,111,187,.45),transparent 62%)}
.radar{position:absolute;right:170px;top:40px;width:560px;height:560px;border-radius:50%;border:2px solid rgba(255,255,255,.07);box-shadow:inset 0 0 0 70px rgba(255,255,255,.012),0 0 0 70px rgba(255,255,255,.025)}
.radar:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 200deg,rgba(42,155,234,0),rgba(42,155,234,.28) 40deg,transparent 41deg)}
.left{position:absolute;left:62px;top:50px;width:560px;z-index:2}
.logo{height:76px;display:block;margin-bottom:32px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
.pill{display:inline-flex;align-items:center;gap:14px;background:linear-gradient(180deg,#ff4a42,#d92a24);color:#fff;font-weight:700;font-size:30px;letter-spacing:.14em;padding:12px 28px 12px 22px;border-radius:999px;box-shadow:0 0 0 6px rgba(229,50,45,.18),0 0 40px rgba(229,50,45,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.pill i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.28),0 0 16px #fff}
h1{font-weight:700;font-size:120px;line-height:.9;letter-spacing:-.04em;margin:28px 0 0;text-shadow:0 8px 30px rgba(0,0,0,.45)}
h1 .n{position:relative;display:inline-block;color:#ffc53d;padding-bottom:10px;text-shadow:0 0 34px rgba(255,197,61,.45),0 8px 30px rgba(0,0,0,.45)}
h1 .n:after{content:"";position:absolute;left:4px;right:0;bottom:-6px;height:12px;border-radius:12px;background:linear-gradient(90deg,#ffc53d,rgba(255,197,61,0));box-shadow:0 0 22px rgba(255,197,61,.55)}
.stage{position:absolute;right:46px;top:44px;width:520px;height:540px;perspective:1400px;z-index:2}
.panel{position:absolute;inset:0;transform:rotateY(-14deg) rotateX(4deg) rotateZ(-1deg);transform-origin:left center;border-radius:32px;padding:18px;background:linear-gradient(160deg,rgba(40,64,96,.88),rgba(16,28,46,.92));border:1.5px solid rgba(255,255,255,.18);box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.18),0 0 80px rgba(0,111,187,.35)}
.bar{display:flex;align-items:center;gap:9px;padding:4px 8px 14px}
.bar i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.22)}
.bar i:first-child{background:#ff4a42;box-shadow:0 0 12px #ff4a42}
.bar span{margin-left:auto;height:12px;width:120px;border-radius:8px;background:rgba(255,255,255,.12)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.t{position:relative;height:222px;border-radius:24px;padding:20px 20px 22px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 30px rgba(0,0,0,.35)}
.t:before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)}
.t b{position:relative;font-size:38px;line-height:1;font-weight:700;letter-spacing:-.015em;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.t svg{position:absolute;right:16px;top:16px}
.c1{background:linear-gradient(150deg,#2a9bea,#0062a8)}
.c2{background:linear-gradient(150deg,#ffcf6b,#ee9f2c);color:#15263a}
.c3{background:linear-gradient(150deg,#1cc39c,#0b7a61)}
.c4{background:linear-gradient(150deg,#ff6a64,#c3221d)}
</style></head>
<body><div class="og">
<div class="bg"></div><div class="shade"></div><div class="dots"></div><div class="g1"></div><div class="g2"></div><div class="radar"></div>
<div class="left">
  <img class="logo" src="logo.png" alt="">
  <span class="pill"><i></i>LIVE</span>
  <h1>Three Village<br><span class="n">Now</span></h1>
</div>
<div class="stage"><div class="panel">
  <div class="bar"><i></i><i></i><i></i><span></span></div>
  <div class="grid">
    <div class="t c1">
      <svg width="132" height="120" viewBox="0 0 132 120"><rect x="4" y="12" width="124" height="104" rx="16" fill="rgba(255,255,255,.16)" stroke="#fff" stroke-width="4"/><path d="M4 38h124" stroke="#fff" stroke-width="4"/><path d="M36 4v18M96 4v18" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <g fill="rgba(255,255,255,.45)"><rect x="18" y="50" width="18" height="16" rx="4"/><rect x="42" y="50" width="18" height="16" rx="4"/><rect x="66" y="50" width="18" height="16" rx="4"/><rect x="18" y="74" width="18" height="16" rx="4"/><rect x="66" y="74" width="18" height="16" rx="4"/><rect x="90" y="74" width="18" height="16" rx="4"/><rect x="18" y="96" width="18" height="12" rx="4"/><rect x="42" y="96" width="18" height="12" rx="4"/></g>
      <rect x="90" y="50" width="18" height="16" rx="4" fill="#ffc24d"/><rect x="42" y="74" width="18" height="16" rx="4" fill="#fff"/></svg>
      <b>Events</b></div>
    <div class="t c2">
      <svg width="100" height="92" viewBox="0 0 130 120"><circle cx="65" cy="62" r="46" fill="rgba(255,255,255,.35)" stroke="#15263a" stroke-width="4"/><circle cx="65" cy="62" r="30" fill="none" stroke="#15263a" stroke-width="3" opacity=".5"/>
      <path d="M8 22v26a8 8 0 0 0 16 0V22M16 22v84" stroke="#15263a" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M118 106V22c-8 4-13 14-13 26v16h13" stroke="#15263a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <b>Eat &amp;<br>Drink</b></div>
    <div class="t c3">
      <svg width="140" height="120" viewBox="0 0 140 120"><g transform="translate(52 44)"><g stroke="#ffd166" stroke-width="6" stroke-linecap="round"><path d="M0-40v12M0 28v12M-40 0h12M28 0h12M-28-28l8 8M20 20l8 8M-28 28l8-8M20-20l8-8"/></g><circle r="22" fill="#ffd166"/></g><path d="M56 110h58a22 22 0 0 0 0-44 30 30 0 0 0-57 8 18 18 0 0 0-1 36z" fill="#fff"/></svg>
      <b>Weather</b></div>
    <div class="t c4">
      <svg width="130" height="120" viewBox="0 0 130 120"><circle cx="65" cy="60" r="56" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/><circle cx="65" cy="60" r="42" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="4"/><path d="M65 26 32 86h66L65 26z" fill="#fff"/><path d="M65 48v20" stroke="#c3221d" stroke-width="7" stroke-linecap="round"/><circle cx="65" cy="77" r="4" fill="#c3221d"/></svg>
      <b>Alerts</b></div>
  </div>
</div></div>
</div></body></html>
