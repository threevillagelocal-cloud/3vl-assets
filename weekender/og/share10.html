<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0c1018;font-family:'Radio Canada',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.ad{position:relative;width:1200px;height:630px;overflow:hidden}
.photo{position:absolute;inset:-40px;background:url(fine12.jpg) center 55%/cover;filter:blur(12px) saturate(1.2) brightness(.95)}
.vig{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,12,20,.85) 0%,rgba(8,12,20,.55) 45%,rgba(8,12,20,.3) 100%),linear-gradient(180deg,rgba(8,12,20,.2),rgba(8,12,20,0) 40%,rgba(8,12,20,.45))}
.head{position:absolute;left:56px;top:80px;width:600px}
.pill{display:inline-flex;align-items:center;gap:12px;background:linear-gradient(180deg,#ff4d45,#e0231c);font-weight:700;font-size:26px;letter-spacing:.16em;padding:9px 22px 9px 17px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);box-shadow:0 8px 22px rgba(224,35,28,.45)}
.pill i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.28)}
h1{white-space:nowrap;font-size:84px;font-weight:700;letter-spacing:-.035em;line-height:.95;margin:20px 0 18px}
h1 span{color:#ffc53d}
.sub{white-space:nowrap;font-size:30px;font-weight:600;line-height:1.2;color:#eef3f8}
.cta{position:absolute;left:56px;top:470px}
.cta b{display:inline-block;padding:16px 32px;border-radius:999px;font-size:34px;font-weight:700;color:#13233a;background:linear-gradient(180deg,#ffd76a,#ffc53d);box-shadow:0 14px 34px rgba(255,197,61,.35)}
.card{position:absolute;width:250px;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 28px 56px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.14)}
.card .im{position:relative;height:190px;background:#1b2f45 center/cover}
.card .tx{padding:14px 18px 18px;color:#13233a}
.card small{display:block;font-size:17px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#006fbb;margin-bottom:4px}
.card b{display:block;font-size:28px;line-height:1.1}
.c1{left:640px;top:70px;transform:rotate(-5deg)}
.c2{left:915px;top:40px;transform:rotate(5deg)}
.dish{position:absolute;right:10px;bottom:-20px;width:76px;height:76px;border-radius:16px;border:4px solid #fff;background:#fff center/cover;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.tag{position:absolute;z-index:3;padding:8px 16px;border-radius:999px;font-size:21px;font-weight:800;color:#006fbb;background:rgba(255,255,255,.96);box-shadow:0 10px 22px rgba(0,0,0,.35)}
.t1{left:650px;top:34px;transform:rotate(-5deg)}.t2{left:960px;top:10px;transform:rotate(5deg)}
.wx{position:absolute;left:700px;top:430px;width:450px;border-radius:24px;overflow:hidden;transform:rotate(-2deg);background:linear-gradient(160deg,#1f3a5c,#0f1a28);border:2px solid rgba(255,197,61,.6);box-shadow:0 28px 56px rgba(0,0,0,.6);z-index:4}
.wx .al{display:flex;align-items:center;gap:12px;padding:12px 20px;background:linear-gradient(90deg,#b8261f,#e0352d);font-size:24px;font-weight:800}
.wx .al i{font-style:normal;display:flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.22)}
.wx .bd{display:flex;align-items:center;gap:18px;padding:14px 20px 18px}
.wx .ic{font-size:58px;line-height:1}
.wx .tt{font-size:30px;font-weight:800;line-height:1.1}
.wx .tt span{display:block;font-size:20px;font-weight:600;color:#c9d6e4;margin-top:4px}
</style></head><body><div class="ad"><div class="photo"></div><div class="vig"></div>

<span class="tag t1">&#128197; This weekend</span><span class="tag t2">&#127869;&#65039; Local specials</span>
<div class="card c1"><div class="im" style="background-image:url(https://cdn.jsdelivr.net/gh/threevillagelocal-cloud/3vl-assets@e512228c4327/weekender/2026-10-02/spyday-720.webp)"></div><div class="tx"><small>Sat, Oct 3</small><b>Culper Spy Day</b></div></div>
<div class="card c2"><div class="im" style="background-image:url(https://cdn.jsdelivr.net/gh/threevillagelocal-cloud/3vl-assets@e512228c4327/weekender/2026-10-02/cc-ext-720.webp)"><span class="dish" style="background-image:url(https://cdn.jsdelivr.net/gh/threevillagelocal-cloud/3vl-assets@e512228c4327/weekender/2026-10-02/cc-spyday-720.webp)"></span></div><div class="tx"><small>The Country Corner</small><b>Spy Day Brunch</b></div></div>
<div class="wx"><div class="al"><i>&#9888;&#65039;</i>Live weather &amp; storm alerts</div><div class="bd"><span class="ic">&#9928;&#65039;</span><span class="tt">Setauket forecast<span>Updated all day from the National Weather Service</span></span></div></div>
</div></body></html>
