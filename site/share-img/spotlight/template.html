<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1200px;height:630px;overflow:hidden}
.c{position:relative;width:1200px;height:630px;overflow:hidden;font-family:'Radio Canada',sans-serif;color:#fff;background:#0b1626}
.bg{position:absolute;inset:-30px;background:url(village.jpg) center/cover;filter:blur(8px) brightness(.42)}
.rib{position:absolute;left:0;top:46px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#ffd76a,#f2a93b);color:#13233a;font-weight:700;font-size:24px;letter-spacing:.07em;text-transform:uppercase;padding:13px 46px 12px 70px;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 50%,100% 100%,0 100%);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.t{position:absolute;left:70px;top:140px;width:560px}
.pill{display:inline-block;font-weight:700;font-size:24px;padding:8px 20px;border-radius:999px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3)}
h1{font-size:62px;line-height:1.04;font-weight:700;letter-spacing:-.01em;margin:20px 0 14px}
.gold{font-size:34px;font-weight:700;color:#ffc53d;line-height:1.15}
.v{margin-top:26px;font-size:26px;font-weight:600;color:#e6eef8}
.card{position:absolute;right:96px;top:60px;width:350px;height:350px;border-radius:28px;background:url(PHOTO.jpg) center 30%/cover;border:6px solid #fff;box-shadow:0 26px 50px rgba(0,0,0,.5)}.lg{position:absolute;right:360px;top:330px;width:170px;height:130px;border-radius:18px;background:#1b3a6b url(logo.png) center/contain no-repeat;border:5px solid #fff;box-shadow:0 14px 30px rgba(0,0,0,.5)}.cl{position:absolute;left:70px;bottom:66px;width:400px;height:auto;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}.who{position:absolute;right:96px;top:426px;width:350px;text-align:right;font-size:24px;font-weight:700}.who small{display:block;font-size:19px;font-weight:600;color:#cfdcec}
.logo{position:absolute;right:66px;bottom:36px;width:230px}
</style></head><body><div class="c"><div class="bg"></div>
<div class="rib">&#9733; Three Village Resident Owned</div>
<div class="t"><span class="pill">&#128205; Stony Brook</span><h1>CMIT Solutions of North Suffolk</h1><div class="gold">IT Support &amp; Computer Services</div></div>
<div class="card"></div><img class="cl" src="LOGO.svg" alt="LOGO"><div class="who">Dave Walters<small>President</small></div><img class="logo" src="3vl-white.png" alt="">
</div></body></html>
