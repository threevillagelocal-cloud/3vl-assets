<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#05080f;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:-30px;background:url(bg-2026-11-06.jpg) center 45%/cover;filter:blur(5px) brightness(.58) saturate(1.15)}
.sh{position:absolute;inset:0;background:radial-gradient(760px 700px at 50% 52%,rgba(5,8,15,.25),rgba(5,8,15,.62) 100%)}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
.logo{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:270px}
h1{font-weight:900;font-size:168px;line-height:.9;letter-spacing:-.04em;text-transform:uppercase;margin-top:40px}
h1 span{display:block}
.sub{margin-top:30px;font-weight:800;font-size:52px;letter-spacing:-.01em;color:#8ec5ff}
.pill{margin-top:34px;padding:14px 34px;border-radius:999px;background:#ffc53d;color:#0f2a4f;font-weight:900;font-size:40px;letter-spacing:.02em}
</style></head><body>
<div class="bg"></div><div class="sh"></div>
<img class="logo" src="logo-white.png" alt="">
<div class="in"><h1><span>This</span><span>weekend</span></h1>
<p class="sub">in Three Village</p>
<p class="pill">NOV 6 - 8</p></div>
</body></html>
