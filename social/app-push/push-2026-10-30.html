<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&family=Creepster&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#0a0612;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:-30px;background:url(bg-2026-10-30.jpg) center 45%/cover;filter:blur(4px) brightness(.55) saturate(1.2)}
.sh{position:absolute;inset:0;background:radial-gradient(700px 640px at 50% 55%,rgba(255,120,20,.18),rgba(20,6,30,.72) 100%)}
.moon{position:absolute;right:90px;top:150px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff6d8,#ffd27a 60%,#f0a63a);box-shadow:0 0 80px 30px rgba(255,190,90,.45)}
.bat{position:absolute;fill:#0b0612}
.web{position:absolute;width:300px;height:300px;stroke:rgba(255,255,255,.55);stroke-width:2.2;fill:none}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
.logo{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:270px}
.spook{font-family:'Creepster',cursive;font-size:96px;color:#ff8a1f;letter-spacing:.03em;text-shadow:0 0 22px rgba(255,120,20,.75),0 4px 0 #3a1200;margin-top:70px}
h1{font-weight:900;font-size:150px;line-height:.9;letter-spacing:-.04em;text-transform:uppercase;margin-top:6px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
h1 span{display:block}
.sub{margin-top:26px;font-weight:800;font-size:50px;letter-spacing:-.01em;color:#ffd9a8}
.pill{margin-top:30px;padding:14px 34px;border-radius:999px;background:#ff8a1f;color:#1a0b00;font-weight:900;font-size:40px;letter-spacing:.02em;box-shadow:0 0 30px rgba(255,138,31,.55)}
.pk{position:absolute;font-size:120px;filter:drop-shadow(0 0 24px rgba(255,140,30,.8))}
</style></head><body>
<div class="bg"></div><div class="sh"></div><div class="moon"></div>

<svg class="bat" style="left:150px;top:210px;width:120px" viewBox="0 0 100 50"><path d="M50 18 C46 8 40 6 38 12 C30 4 16 2 0 14 C12 16 18 24 20 32 C26 26 34 28 38 34 C42 30 46 30 50 36 C54 30 58 30 62 34 C66 28 74 26 80 32 C82 24 88 16 100 14 C84 2 70 4 62 12 C60 6 54 8 50 18Z"/></svg>

<svg class="bat" style="right:250px;top:330px;width:90px;transform:rotate(10deg)" viewBox="0 0 100 50"><path d="M50 18 C46 8 40 6 38 12 C30 4 16 2 0 14 C12 16 18 24 20 32 C26 26 34 28 38 34 C42 30 46 30 50 36 C54 30 58 30 62 34 C66 28 74 26 80 32 C82 24 88 16 100 14 C84 2 70 4 62 12 C60 6 54 8 50 18Z"/></svg>
<img class="logo" src="logo-white.png" alt="">
