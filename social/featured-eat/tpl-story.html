<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@500;600;700&display=block" rel="stylesheet"><style>html,body{width:1080px;height:1920px}
html,body{margin:0;overflow:hidden;background:#0b1424}
.bg{position:absolute;inset:-20px;background:url({{BG}}) 8% 50%/cover;filter:blur(2px) brightness(.8) saturate(1.15)}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,12,26,.45),rgba(6,12,26,.15) 35%,rgba(6,12,26,.55))}
.wrap{position:absolute;inset:0;padding:190px 56px 0;font-family:'Radio Canada',sans-serif;color:#fff}
.pill{display:inline-flex;align-items:center;gap:12px;background:#ffc53d;color:#1a1300;font-weight:700;font-size:30px;letter-spacing:.08em;text-transform:uppercase;padding:12px 26px;border-radius:999px;box-shadow:0 0 34px rgba(255,197,61,.55)}
h1{margin:22px 0 0;font-weight:700;font-size:104px;line-height:1.02;letter-spacing:-.02em}
h1 span{color:#ffc53d}
.sub{font-size:36px;font-weight:500;margin-top:14px;color:#e9eef6}
.g{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:46px}
.c{border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.45);border:3px solid #ffc53d}
.p{height:248px;background-size:cover}
.t{padding:14px 18px 16px;color:#0b1424;display:flex;flex-direction:column;gap:4px}
.t b{font-size:31px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t i{font-style:normal;font-size:27px;font-weight:600;color:#a87406}
.cta{position:absolute;left:0;right:0;bottom:120px;text-align:center}
.cta span{display:inline-block;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.55);backdrop-filter:blur(10px);font-family:'Radio Canada';font-weight:700;font-size:34px;color:#fff;padding:16px 36px;border-radius:999px}
.cta span em{font-style:normal;color:#ffc53d}

.rays{position:absolute;left:-260px;top:-420px;width:1300px;height:1300px;background:repeating-conic-gradient(from 0deg,rgba(255,197,61,.20) 0 6deg,rgba(255,197,61,0) 6deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 0,#000 25%,transparent 62%);pointer-events:none}
.glow{position:absolute;left:-200px;top:-260px;width:1100px;height:800px;background:radial-gradient(ellipse at 40% 45%,rgba(255,170,30,.38),rgba(255,170,30,0) 62%)}
.live{display:flex;justify-content:center;align-items:center;gap:20px;width:100%;box-sizing:border-box;background:#e3262f;color:#fff;font-weight:700;font-size:56px;letter-spacing:.1em;text-transform:uppercase;padding:16px 26px;border-radius:999px;box-shadow:0 0 0 6px rgba(227,38,47,.25),0 0 40px rgba(227,38,47,.6)}
.live i{width:26px;height:26px;flex:none;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.35)}
h1.hy{margin:20px 0 0;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:.95;font-size:120px}
h1.hy .a{display:block;color:#fff;text-shadow:0 6px 26px rgba(0,0,0,.5)}
h1.hy .b{display:inline-block;margin-top:12px;background:linear-gradient(180deg,#ffd75e,#ffb400);color:#1a1000;padding:6px 22px 2px;border-radius:14px;transform:rotate(-2deg);box-shadow:0 10px 40px rgba(255,180,0,.55);font-size:106px}
h1.hy .b em{font-style:normal}

.p{position:relative}
.stamp{position:absolute;left:14px;bottom:14px;transform:rotate(-5deg);transform-origin:left bottom;background:#e3262f;color:#fff;font-family:'Radio Canada';font-weight:700;letter-spacing:.02em;padding:7px 14px 6px;border-radius:8px;outline:3px dashed rgba(255,255,255,.85);outline-offset:-7px;box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 0 3px #fff;white-space:nowrap}
.stamp b{color:#ffd75e}
</style></head><body>
<div class="bg"></div><div class="sh"></div><div class="glow"></div><div class="rays"></div><div class="wrap"><span class="live"><i></i>Live on our homepage</span><h1 class="hy"><span class="a">Featured</span><span class="b">Right now! 🔥</span></h1>
<div class="g">{{CARDS}}</div></div>
<div class="cta"><span>See them all on <em>ThreeVillageLocal.com</em></span></div></body></html>
