<script>
var DURATION=10;
function cl(x){return x<0?0:x>1?1:x}
function eo(x){x=cl(x);return 1-Math.pow(1-x,3)}
function eb(x){x=cl(x);var c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function p(t,a,d){return (t-a)/d}
var Q=function(s){return [].slice.call(document.querySelectorAll(s))};
function render(t){
  var bg=document.querySelector('.bg');bg.style.transform='scale('+(1.04+0.06*t/DURATION)+')';
  var r=document.querySelector('.rays');r.style.transform='rotate('+(t*9)+'deg)';r.style.opacity=eo(p(t,0,1));
  var g=document.querySelector('.glow');g.style.opacity=(0.75+0.25*Math.sin(t*3))*eo(p(t,0,1));
  var lv=document.querySelector('.live');var k=eb(p(t,0.15,0.55));lv.style.transform='translateY('+(-260*(1-k))+'px)';lv.style.opacity=cl(p(t,0.15,0.2));
  var dot=document.querySelector('.live i');var ph=(t*1.4)%1;dot.style.boxShadow='0 0 0 '+(4+14*ph)+'px rgba(255,255,255,'+(0.55*(1-ph))+')';
  var a=document.querySelector('.hy .a');k=eb(p(t,0.55,0.5));a.style.transform='scale('+(1.9-0.9*k)+')';a.style.transformOrigin='left center';a.style.opacity=cl(p(t,0.55,0.15));
  var b=document.querySelector('.hy .b');k=eb(p(t,0.95,0.55));var pulse=t>2?1+0.035*Math.sin((t-2)*4):1;
  b.style.transform='rotate('+(-2-14*(1-k))+'deg) scale('+((0.3+0.7*k)*pulse)+')';b.style.transformOrigin='left center';b.style.opacity=cl(p(t,0.95,0.15));
  Q('.c').forEach(function(c,i){var st=1.6+i*0.32;var k=eb(p(t,st,0.5));c.style.transform='translateY('+(90*(1-k))+'px) scale('+(0.7+0.3*k)+')';c.style.opacity=cl(p(t,st,0.2))});
  Q('.stamp').forEach(function(s,i){var st=1.6+i*0.32+0.38;var x=p(t,st,0.22);var k=eo(x);var sh=x>1&&x<2.2?Math.sin((x-1)*30)*(2.2-x)*1.6:0;
    s.style.transform='rotate('+(-5+sh)+'deg) scale('+(2.4-1.4*k)+')';s.style.opacity=cl(x*3)});
  var cta=document.querySelector('.cta');k=eb(p(t,4.0,0.6));cta.style.transform='translateY('+(160*(1-k))+'px)';cta.style.opacity=cl(p(t,4.0,0.25));
  var cs=document.querySelector('.cta span');var sw=t>4.6?(t-4.6)%2.2/2.2:0;cs.style.boxShadow=t>4.6?'0 0 '+(10+30*Math.sin(sw*Math.PI))+'px rgba(255,197,61,'+(0.7*Math.sin(sw*Math.PI))+')':'none';
}
if(location.search.indexOf('capture')<0){var t0=performance.now();(function f(){render(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(f)})()}else render(0);
</script>
