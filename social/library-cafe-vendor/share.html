<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Radio+Canada:wght@600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:960px;height:640px;overflow:hidden;background:#13233a}
.bg{position:absolute;left:0;right:0;top:54px;bottom:0;-webkit-mask:linear-gradient(180deg,transparent 0,#000 26px);mask:linear-gradient(180deg,transparent 0,#000 26px);background:url(cafe.png) 50% 0/cover no-repeat}
.fade{position:absolute;left:0;right:0;bottom:0;height:330px;background:linear-gradient(180deg,rgba(13,27,48,0) 0%,rgba(13,27,48,.78) 38%,rgba(13,27,48,.94) 100%)}
.txt{position:absolute;left:0;right:0;bottom:96px;text-align:center;font-family:'Anton',sans-serif;color:#fff}
.k{display:inline-block;font-family:'Radio Canada',sans-serif;font-weight:700;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:#13233a;background:#ffc53d;border-radius:999px;padding:6px 20px;margin-bottom:12px}
h1{font-weight:400;font-size:76px;line-height:1;letter-spacing:.01em;text-transform:uppercase;text-shadow:0 3px 14px rgba(0,0,0,.35)}
.sub{margin-top:10px;font-family:'Radio Canada',sans-serif;font-weight:600;font-size:25px;color:#e3ecf8}
.logo{position:absolute;right:24px;bottom:84px;width:104px;opacity:.95}
</style></head>
<body><div style="position:absolute;inset:-30px;background:url(cafe.png) 50% 60%/cover;filter:blur(40px) brightness(.85) saturate(.8)"></div><div class="bg"></div><div class="fade"></div>
<div class="txt"><div class="k">Now seeking</div><h1>A new caf&eacute; vendor</h1><p class="sub">Emma S. Clark Memorial Library &middot; Setauket</p></div>
<img class="logo" src="logo-white.png" alt="">
</body></html>
