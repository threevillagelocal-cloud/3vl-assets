<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0c1018;font-family:'Radio Canada',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.ad{position:relative;width:1080px;height:1350px;overflow:hidden}
.bg{position:absolute;inset:-40px;background:url(village-hero.jpg) center 60%/cover;filter:blur(9px) saturate(1.2) brightness(1)}
.vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,20,.82) 0%,rgba(8,12,20,.55) 45%,rgba(8,12,20,.38) 100%)}
.head{position:absolute;left:64px;right:64px;top:56px}
.pill{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:32px;padding:10px 26px;border-radius:999px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35)}
h1{font-size:112px;font-weight:700;letter-spacing:-.035em;line-height:.98;margin:28px 0 0}
h1 span{display:block;color:#ffc53d;margin-top:10px;white-space:nowrap;font-size:99px}
.sub{margin-top:26px;font-size:40px;font-weight:600;color:#eef3f8}
.cta{display:inline-flex;align-items:center;margin-top:28px;font-weight:700;font-size:40px;padding:14px 34px;border-radius:999px;background:linear-gradient(180deg,#ffd76a,#ffc53d);color:#13233a;border:1.5px solid rgba(255,255,255,.5);box-shadow:0 10px 26px rgba(255,197,61,.35)}
.grid{position:absolute;left:64px;right:64px;bottom:64px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.card{height:318px;border-radius:28px;background:#fff center/cover;border:8px solid #fff;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.18)}
</style></head><body><div class="ad"><div class="bg"></div><div class="vig"></div>
<div class="head"><div class="pill">October 2 - 4</div>
<h1>What&rsquo;s happening<span>this weekend in town</span></h1>
<div class="sub">Events, food specials, weather and more</div>
<div class="cta">ThreeVillageLocal.com</div></div>
<div class="grid">
<div class="card" style="background-image:url(spyday.jpg);background-position:center 30%"></div>
<div class="card" style="background-image:url(spooky.jpg);background-position:70% center"></div>
<div class="card" style="background-image:url(blues.jpg)"></div>
<div class="card" style="background-image:url(scarecrow.jpg);background-position:center 45%"></div>
</div></div></body></html>
