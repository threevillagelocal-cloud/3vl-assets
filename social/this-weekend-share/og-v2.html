<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#05080f;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:-30px;background:url(bg.jpg) center 58%/cover;filter:blur(4px) brightness(.66) saturate(1.15)}
.sh{position:absolute;inset:0;background:radial-gradient(900px 520px at 50% 52%,rgba(5,8,15,.22),rgba(5,8,15,.42) 100%)}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
.logo{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:210px}
h1{font-weight:900;font-size:104px;line-height:.96;letter-spacing:-.035em;text-transform:uppercase;margin-top:34px}
h1 span{display:block}
.date{display:inline-block;margin-top:22px;background:#ffc53d;color:#13233a;font-weight:800;font-size:34px;padding:8px 26px;border-radius:999px}
.sub{margin-top:18px;font-weight:600;font-size:30px;letter-spacing:.01em;color:#8ec5ff}
</style></head><body>
<div class="bg"></div><div class="sh"></div>
<img class="logo" src="logo-white.png" alt="">
<div class="in"><h1><span>Things to do</span><span>this weekend</span></h1>
<div class="date">Oct 30 - Nov 1</div><p class="sub">Stony Brook &middot; Setauket &middot; Port Jefferson</p></div>
</body></html>
