<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@500;600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--w);height:var(--h);overflow:hidden;font-family:'Radio Canada',sans-serif;color:#13233a;background:#fff}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#fff}
.photo{position:absolute;left:0;top:0;width:100%;height:var(--ph);background:url(p-main.jpg) var(--pos)/cover no-repeat}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 55%,#fff 99%)}
.stripe{position:absolute;left:0;right:0;top:0;height:12px;display:flex}.stripe i{flex:1}.stripe i:first-child{background:#b22234}.stripe i:last-child{background:#1f3f8f}
.ins{position:absolute;left:0;right:0;top:var(--it);display:flex;justify-content:center;gap:24px}
.ins figure{width:var(--iw);height:var(--ih);border-radius:22px;overflow:hidden;border:6px solid #fff;box-shadow:0 16px 34px rgba(19,35,58,.22)}
.ins img{width:100%;height:100%;object-fit:cover;display:block}
.panel{position:absolute;left:60px;right:60px;top:var(--pt);text-align:center}
.logo{width:var(--lw);display:block;margin:0 auto 18px}
.k{display:inline-flex;align-items:center;gap:12px;font-size:var(--kf);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#1f3f8f;background:#eef3fc;border-radius:999px;padding:11px 28px}
.k b{color:#b22234}
.n{margin-top:var(--hm);font-size:var(--nf);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#b22234}
h1{text-wrap:balance;margin-top:6px;font-size:var(--hf);line-height:1.02;font-weight:700;letter-spacing:-.015em;color:#13233a}
h1 span{white-space:nowrap;color:#1f3f8f;background:linear-gradient(transparent 76%,#ffc53d 76%,#ffc53d 90%,transparent 90%)}
.opts{display:flex;gap:22px;margin-top:var(--om);text-align:left}
.opt{flex:1;background:#f4f7fc;border:2px solid #dbe4f3;border-radius:22px;padding:var(--op);display:flex;gap:16px;align-items:flex-start}
.opt i{flex:none;width:var(--ic);height:var(--ic);border-radius:50%;background:#1f3f8f;color:#ffc53d;font-style:normal;font-size:calc(var(--ic) * .5);display:flex;align-items:center;justify-content:center}
.opt b{display:block;font-size:var(--of);line-height:1.08;color:#13233a}
.opt em{display:block;font-style:normal;margin-top:6px;font-size:var(--os);line-height:1.2;font-weight:600;color:#4a5a72}
.cta{display:inline-block;margin-top:var(--cm);background:#1f3f8f;color:#fff;font-size:var(--cf);font-weight:700;padding:24px 54px;border-radius:999px;box-shadow:0 14px 30px rgba(31,63,143,.32);text-transform:uppercase;letter-spacing:.02em}
.cta em{font-style:normal;color:#ffc53d}
.fine{margin-top:16px;font-size:var(--ff);font-weight:600;color:#6a7889}
</style></head>
<body><div class="stage">
<div class="photo"></div><div class="stripe"><i></i><i></i></div>
<div class="ins"><figure><img src="p-guard-2x.jpg" alt=""></figure><figure><img src="p-esvfw-2x.jpg" alt=""></figure></div>
<div class="panel">
 <img class="logo" src="logo-navy.png" alt="">
 <div class="k"><b>&#9733;</b> Veterans Day &middot; November 11</div>
 <div class="n">Nominations open</div>
 <h1>Nominate a veteran or&nbsp;a<br><span>veteran-owned business</span></h1>
 <div class="opts">
  <div class="opt"><i>&#9733;</i><div><b>A veteran you know</b><em>Share a thank-you and we will honor them publicly</em></div></div>
  <div class="opt"><i>&#9873;</i><div><b>A veteran-owned business</b><em>Featured free on our site and social media</em></div></div>
 </div>
 <div class="cta">CTATEXT</div>
 <div class="fine">Free &middot; Takes 2 minutes &middot; Nominate by Thursday, Nov 5</div>
</div>
</div></body></html>
