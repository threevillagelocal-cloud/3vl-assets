name: Three Village Now - Instagram specials

# Started by the 3VL clock (clock.yml) at 8:00, 11:00 and 3:00 PM ET. GitHub schedules ran hours late, so no cron here.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-specials
  cancel-in-progress: false

jobs:
  specials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - name: Read Instagram, pick out specials
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weekender/live/ig_specials.py
      - name: Rebuild the live feed
        run: python weekender/live/build_events.py
      - name: Commit
        run: |
          git config user.name "3VL specials"
          git config user.email "actions@users.noreply.github.com"
          git add weekender/live
          git diff --cached --quiet || (git commit -m "Instagram specials $(date -u +%F-%H%M)" && git pull --rebase -q && git push)
      - name: Tell the site guard (homepage feature notices)
        env:
          GUARD_DEPLOY_KEY: ${{ secrets.GUARD_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s
' "$GUARD_DEPLOY_KEY" > ~/.ssh/guard && chmod 600 ~/.ssh/guard
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/guard -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 git@github.com:threevillagelocal-cloud/3vl-site-guard.git /tmp/guard && cd /tmp/guard
          git config user.name "3VL specials" && git config user.email "actions@users.noreply.github.com"
          mkdir -p data/featured && date -u +%FT%TZ > data/featured/ping.txt
          git add data/featured/ping.txt && git commit -qm "specials refreshed"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
