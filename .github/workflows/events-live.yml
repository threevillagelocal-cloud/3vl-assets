name: Three Village Now events (hourly)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build events.json
        run: python weekender/live/build_events.py
      - name: Commit if changed
        run: |
          git config user.name "3VL events bot"
          git config user.email "actions@users.noreply.github.com"
          git add weekender/live/events.json
          git diff --cached --quiet || (git commit -m "events: hourly refresh $(date -u +%FT%H:%MZ)" && git pull --rebase -q && git push)
