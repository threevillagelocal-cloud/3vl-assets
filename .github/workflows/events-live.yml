name: Three Village Now events (hourly)

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# also started by the 3VL clock every 2 hours (6:30 AM, then 9 AM-9 PM ET; owner 10/12/2026) (ferry alerts + events stay fresh even when GitHub's cron runs late)
concurrency:
  group: events-live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Port Jefferson Ferry service alerts
        run: python weekender/live/ferry.py || echo "ferry check failed (keeping last state)"
      - name: Build events.json
        run: python weekender/live/build_events.py
      - name: Commit if changed
        run: |
          git config user.name "3VL events bot"
          git config user.email "actions@users.noreply.github.com"
          git add weekender/live/events.json weekender/live/ferry.json weekender/live/eat_week.json
          git diff --cached --quiet && exit 0
          git commit -qm "events: hourly refresh $(date -u +%FT%H:%MZ)"
          # ig-specials.yml also writes events.json: on a rebase conflict rebuild it on top of the latest (with its specials)
          for i in 1 2 3 4; do
            if git pull --rebase --autostash -q; then git push -q && exit 0
            else
              git checkout --theirs weekender/live/events.json && python weekender/live/build_events.py && git add weekender/live/events.json \
                && GIT_EDITOR=true git rebase --continue && git push -q && exit 0
              git rebase --abort 2>/dev/null || true
            fi
            sleep 10
          done
          exit 1
      - name: Eat & Drink landing pages (the site guard builds them only when needed)
        env:
          GUARD_DEPLOY_KEY: ${{ secrets.GUARD_DEPLOY_KEY }}
        run: |
          git pull -q --rebase --autostash || true
          python weekender/live/eat_need.py || exit 0
          mkdir -p ~/.ssh && printf '%s\n' "$GUARD_DEPLOY_KEY" > ~/.ssh/guard && chmod 600 ~/.ssh/guard
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/guard -o StrictHostKeyChecking=accept-new"
          rm -rf /tmp/guard-eat && git clone -q --depth 1 git@github.com:threevillagelocal-cloud/3vl-site-guard.git /tmp/guard-eat && cd /tmp/guard-eat
          git config user.name "3VL events bot" && git config user.email "actions@users.noreply.github.com"
          mkdir -p data/clock && date -u +%FT%TZ > data/clock/eat.txt
          git add data/clock/eat.txt && git commit -qm "eat pages needed"
          for i in 1 2 3 4; do git pull -q --rebase --autostash && git push -q && exit 0; sleep 10; done
