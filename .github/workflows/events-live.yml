name: Three Village Now events (hourly)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# also started by the 3VL clock every 30 min, 7 AM-10 PM ET (ferry alerts + events stay fresh even when GitHub's cron runs late)
concurrency:
  group: events-live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Port Jefferson Ferry service alerts
        run: python weekender/live/ferry.py || echo "ferry check failed (keeping last state)"
      - name: Build events.json
        run: python weekender/live/build_events.py
      - name: Commit if changed
        run: |
          git config user.name "3VL events bot"
          git config user.email "actions@users.noreply.github.com"
          git add weekender/live/events.json weekender/live/ferry.json
          git diff --cached --quiet && exit 0
          git commit -qm "events: hourly refresh $(date -u +%FT%H:%MZ)"
          # ig-specials.yml also writes events.json: on a rebase conflict rebuild it on top of the latest (with its specials)
          for i in 1 2 3 4; do
            if git pull --rebase -q; then git push -q && exit 0
            else
              git checkout --theirs weekender/live/events.json && python weekender/live/build_events.py && git add weekender/live/events.json \
                && GIT_EDITOR=true git rebase --continue && git push -q && exit 0
              git rebase --abort 2>/dev/null || true
            fi
            sleep 10
          done
          exit 1
