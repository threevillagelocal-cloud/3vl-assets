name: Instagram connection test (manual)
on:
  workflow_dispatch:
    inputs:
      script:
        default: ig_test.py
      handles:
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Instagram Business Discovery
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_HANDLES: ${{ inputs.handles }}
        run: python weekender/live/${{ inputs.script || 'ig_test.py' }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.script == 'ig_photos.py' }}
        with:
          name: igpull
          path: igpull
          retention-days: 3
