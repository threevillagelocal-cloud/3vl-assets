<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;background:#13233a;font-family:'Radio Canada',sans-serif;color:#fff}
#mast{position:relative;width:1200px;height:560px;overflow:hidden;border-radius:32px 32px 0 0;
 background:radial-gradient(circle at 88% 6%,rgba(143,208,255,.26),transparent 42%),radial-gradient(circle at 0% 100%,rgba(58,160,232,.38),transparent 48%),linear-gradient(150deg,#1f3a5c 0%,#13233a 55%,#0f1a28 100%)}
#mast .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.logo{position:absolute;left:60px;top:54px;padding:16px 24px;border-radius:26px;background:rgba(255,255,255,.95);box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 1px 0 #fff}
.logo img{display:block;height:92px}
.chip{position:absolute;left:60px;top:250px;display:flex;align-items:center;gap:14px}
.chip b{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;font-size:22px;letter-spacing:.2em;font-weight:700;color:#13233a;background:linear-gradient(180deg,#ffd76a,#ffc53d);box-shadow:0 10px 26px rgba(255,197,61,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.chip b i{width:12px;height:12px;border-radius:50%;background:#13233a}
.chip span{padding:11px 20px;border-radius:999px;font-size:22px;color:#e6edf5;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
h1{position:absolute;left:60px;right:60px;top:336px;font-size:68px;line-height:1.04;letter-spacing:-.02em;font-weight:700}
h1 em{font-style:normal;color:#ffc53d}
</style></head>
<body><div id="mast"><div class="grid"></div>
<div class="logo"><img src="https://www.threevillagelocal.com/images/logo_optimized.png" alt=""></div>
<div class="chip"><b><i></i>MEMBER INSIDER</b><span>Issue #1 &middot; September 28, 2026</span></div>
<h1>What Three Village Local <em>delivers</em> for local businesses</h1>
</div></body></html>
