<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;background:#ffffff;font-family:'Radio Canada',sans-serif;color:#fff}
#mast{position:relative;width:1200px;height:520px;overflow:hidden;border-radius:32px 32px 0 0;
 background:radial-gradient(circle at 92% 0%,rgba(0,111,187,.10),transparent 40%),radial-gradient(circle at 0% 100%,rgba(0,111,187,.06),transparent 45%),#ffffff}
#mast .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(27,47,69,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(27,47,69,.045) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.logo{position:absolute;left:52px;top:44px}
.logo img{display:block;height:112px}
.chip{position:absolute;left:60px;top:214px;display:flex;align-items:center;gap:14px}
.chip b{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;font-size:22px;letter-spacing:.2em;font-weight:700;color:#13233a;background:linear-gradient(180deg,#ffd76a,#ffc53d);box-shadow:0 10px 26px rgba(255,197,61,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.chip b i{width:12px;height:12px;border-radius:50%;background:#13233a}
.chip span{padding:11px 20px;border-radius:999px;font-size:22px;color:#1b2f45;background:#eef4fa;border:1.5px solid #d9e6f2}
h1{position:absolute;left:60px;right:60px;top:300px;font-size:68px;line-height:1.04;letter-spacing:-.02em;font-weight:700;color:#13325a}
h1 em{font-style:normal;color:#006fbb;text-decoration:underline;text-decoration-color:#ffc53d;text-decoration-thickness:.12em;text-underline-offset:.1em;text-decoration-skip-ink:none}
</style></head>
<body><div id="mast"><div class="grid"></div>
<div class="logo"><img src="https://www.threevillagelocal.com/images/logo_optimized.png" alt=""></div>
<div class="chip"><b><i></i>MEMBER INSIDER</b><span>Issue #1 &middot; September 28, 2026</span></div>
<h1>What Three Village Local <em>delivers</em> for local businesses</h1>
</div></body></html>
