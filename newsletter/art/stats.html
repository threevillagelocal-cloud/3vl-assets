<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;background:#ffffff;font-family:'Radio Canada',sans-serif;color:#13233a}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:4px 0}
.t{position:relative;overflow:hidden;height:272px;border-radius:30px;padding:28px 30px 26px;
 background:linear-gradient(155deg,color-mix(in srgb,var(--c) 20%,#ffffff),color-mix(in srgb,var(--c) 34%,#eef3f8));border:1.5px solid color-mix(in srgb,var(--c) 45%,#c9d6e4);
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 12px 28px rgba(27,47,69,.12)}
.t:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.28}
.ic{position:relative;width:78px;height:78px;border-radius:24px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(145deg,color-mix(in srgb,var(--c) 85%,#ffffff 15%) 0%,color-mix(in srgb,var(--c) 55%,#13233a) 100%);border:1.5px solid rgba(255,255,255,.45);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -10px 18px rgba(0,0,0,.18),0 12px 26px color-mix(in srgb,var(--c) 40%,transparent)}
.ic:after{content:"";position:absolute;left:7px;right:7px;top:5px;height:42%;border-radius:18px 18px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0))}
.ic svg{position:relative;width:54px;height:54px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.ic{width:88px!important;height:88px!important;border-radius:26px!important}
.ic.trophy{background:linear-gradient(145deg,#ffd76a 0%,#f5b400 60%,#e89f00 100%)!important;border-color:rgba(255,255,255,.7)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -10px 18px rgba(0,0,0,.12),0 12px 26px rgba(245,180,0,.35)!important}
.ic.trophy svg path[fill="#f5a800"]{fill:#0f866c}
.soc{position:relative;display:flex;align-items:center;gap:14px;height:88px}
.soc span{position:relative;width:88px;height:88px;border-radius:26px;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.55);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -10px 18px rgba(0,0,0,.14),0 12px 24px rgba(27,47,69,.2)}
.soc span:after{content:"";position:absolute;left:7px;right:7px;top:5px;height:40%;border-radius:20px 20px 32px 32px;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0))}
.soc svg{position:relative;width:56px;height:56px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.soc .fb{background:linear-gradient(160deg,#3b95ff,#1877f2 55%,#0d5fd1)}
.soc .ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.soc em{font-style:normal;font-size:26px;font-weight:700;color:#0866ff;margin-left:6px;letter-spacing:-.01em}
.n{position:absolute;left:30px;bottom:68px;font-size:62px;font-weight:700;letter-spacing:-.02em;line-height:1}
.l{position:absolute;left:30px;right:24px;bottom:26px;font-size:26px;color:#3d4b5a;line-height:1.2}
.gold .n{color:#13233a}
.t.gold{background:linear-gradient(155deg,#fff8dc,#ffeaa6);border-color:#f3d06e}
.gold .ic{background:linear-gradient(145deg,#ffe699 0%,#ffc53d 55%,#f5a800 100%)}
.gold:before{display:none}
.shine{position:absolute;inset:-10%;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.75) 48%,rgba(255,255,255,.2) 54%,transparent 62%);transform:translateX(var(--x,-120%))}
</style></head>
<body><div id="stats">
<div class="t" style="--c:#3aa0e8"><div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="38" height="32" rx="6" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="3"/><path d="M5 16h38" stroke="#fff" stroke-width="3"/><circle cx="10.5" cy="12" r="1.4" fill="#fff"/><circle cx="15" cy="12" r="1.4" fill="#fff"/><rect x="12" y="27" width="5" height="8" rx="1.5" fill="#fff"/><rect x="21.5" y="23" width="5" height="12" rx="1.5" fill="#fff"/><rect x="31" y="19.5" width="5" height="15.5" rx="1.5" fill="#ffd76a"/></svg></div><div class="n">179,930</div><div class="l">pages viewed on our site in 2026</div><div class="shine"></div></div>
<div class="t" style="--c:#5aa9e6"><div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="15.5" r="6.5" fill="#fff"/><path d="M12.5 38c1.2-7 5.8-11 11.5-11s10.3 4 11.5 11z" fill="#fff"/><circle cx="11" cy="19" r="4.6" fill="rgba(255,255,255,.75)"/><path d="M2.8 36c.9-5 4-8 8.2-8 1.7 0 3.2.4 4.5 1.3-2.2 1.9-3.7 4.4-4.4 6.7z" fill="rgba(255,255,255,.75)"/><circle cx="37" cy="19" r="4.6" fill="rgba(255,255,255,.75)"/><path d="M45.2 36c-.9-5-4-8-8.2-8-1.7 0-3.2.4-4.5 1.3 2.2 1.9 3.7 4.4 4.4 6.7z" fill="rgba(255,255,255,.75)"/></svg></div><div class="n">86,829</div><div class="l">site visitors so far this year</div><div class="shine"></div></div>
<div class="t gold" style="--c:#ffc53d"><div class="soc"><span class="fb"><svg viewBox="0 0 48 48"><path fill="#fff" d="M26.6 42V26.9h5.1l.8-5.9h-5.9v-3.8c0-1.7.5-2.9 2.9-2.9h3.1V9c-.5-.1-2.4-.2-4.5-.2-4.5 0-7.6 2.7-7.6 7.8V21h-5.1v5.9h5.1V42z"/></svg></span><span class="ig"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.6"><rect x="9" y="9" width="30" height="30" rx="9"/><circle cx="24" cy="24" r="7.2"/><circle cx="33" cy="15" r="1.6" fill="#fff" stroke="none"/></svg></span><em>Meta</em></div><div class="n">9,577</div><div class="l">social followers, nearly 10,000</div><div class="shine"></div></div>
<div class="t" style="--c:#1fb58f"><div class="ic trophy"><svg viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8h18v10a9 9 0 0 1-18 0z" fill="#fff"/><path d="M15 12H9a6 6 0 0 0 6 7M33 12h6a6 6 0 0 1-6 7" stroke="#fff" stroke-width="3"/><path d="M24 27v6M17 40h14M19 40l1.5-7h7L29 40" stroke="#fff" stroke-width="3"/><path d="M24 11.5l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#f5a800"/></svg></div><div class="n">16,301</div><div class="l">visitors in August, our best month</div><div class="shine"></div></div>
</div></body></html>
