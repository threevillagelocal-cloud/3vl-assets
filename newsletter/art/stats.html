<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;background:#ffffff;font-family:'Radio Canada',sans-serif;color:#13233a}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:4px 0}
.t{position:relative;overflow:hidden;height:272px;border-radius:30px;padding:28px 30px 26px;
 background:linear-gradient(155deg,#ffffff,#f3f7fb);border:1.5px solid #e3e9f0;
 box-shadow:inset 0 1.5px 0 #fff,0 12px 28px rgba(27,47,69,.10)}
.t:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.16}
.ic{position:relative;width:78px;height:78px;border-radius:24px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(145deg,color-mix(in srgb,var(--c) 85%,#ffffff 15%) 0%,color-mix(in srgb,var(--c) 55%,#13233a) 100%);border:1.5px solid rgba(255,255,255,.45);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -10px 18px rgba(0,0,0,.18),0 12px 26px color-mix(in srgb,var(--c) 40%,transparent)}
.ic:after{content:"";position:absolute;left:7px;right:7px;top:5px;height:42%;border-radius:18px 18px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0))}
.ic svg{position:relative;width:44px;height:44px}
.n{position:absolute;left:30px;bottom:68px;font-size:62px;font-weight:700;letter-spacing:-.02em;line-height:1}
.l{position:absolute;left:30px;right:24px;bottom:26px;font-size:26px;color:#5b6978;line-height:1.2}
.gold .n{color:#13233a}
.gold .ic{background:linear-gradient(145deg,#ffe699 0%,#ffc53d 55%,#f5a800 100%)}
.gold:before{display:none}
.shine{position:absolute;inset:-10%;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.75) 48%,rgba(255,255,255,.2) 54%,transparent 62%);transform:translateX(var(--x,-120%))}
</style></head>
<body><div id="stats">
<div class="t" style="--c:#3aa0e8"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg></div><div class="n">179,930</div><div class="l">pages viewed on our site in 2026</div><div class="shine"></div></div>
<div class="t" style="--c:#5aa9e6"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.9-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.8 14.2c2.3.2 4.1 1.8 4.7 4.8"/></svg></div><div class="n">86,829</div><div class="l">site visitors so far this year</div><div class="shine"></div></div>
<div class="t gold" style="--c:#ffc53d"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#13233a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></div><div class="n">9,577</div><div class="l">social followers, nearly 10,000</div><div class="shine"></div></div>
<div class="t" style="--c:#1fb58f"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M9 20h6"/></svg></div><div class="n">16,301</div><div class="l">visitors in August, our best month</div><div class="shine"></div></div>
</div></body></html>
